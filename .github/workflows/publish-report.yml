name: Publish SABRDF report
on:
  workflow_dispatch:
    inputs:
      report_type:
        description: "daily, weekly, or monthly"
        required: true
        type: choice
        options: [daily, weekly, monthly]
      report_date:
        description: "Report date (YYYY-MM-DD)"
        required: true
        type: string
      report_title:
        description: "Report title"
        required: true
        type: string
      report_summary:
        description: "Verified research summary (no secrets)"
        required: true
        type: string
      source_url:
        description: "Optional public HTTPS source link"
        required: false
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and save report
        env:
          REPORT_TYPE: ${{ inputs.report_type }}
          REPORT_DATE: ${{ inputs.report_date }}
          REPORT_TITLE: ${{ inputs.report_title }}
          REPORT_SUMMARY: ${{ inputs.report_summary }}
          REPORT_SOURCE_URL: ${{ inputs.source_url }}
        run: python scripts/publish_report.py
      - name: Commit report feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish SABRDF research report"
          git push
